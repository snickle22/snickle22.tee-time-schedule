<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tee Times Schedule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- SheetJS Library to read multi-tab Excel files (.xlsx) directly -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-6" x-data="scheduleApp()" x-init="init()">

  <!-- Main Single-Column Container -->
  <div class="w-[95%] mx-auto space-y-6">

    <!-- Header, Fullscreen Toggle & Large Clock -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-200">
      <div>
        <h1 class="text-3xl font-black tracking-tight text-gray-800">Live Tee Times Schedule</h1>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
        <!-- Fullscreen Toggle Button -->
        <button 
          @click="toggleFullscreen" 
          class="flex items-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold px-3.5 py-2.5 rounded-xl transition-all border border-gray-300/70"
          title="Toggle Fullscreen Mode">
          <svg x-show="!isFullscreen" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
          </svg>
          <svg x-show="isFullscreen" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: none;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 14l-5 5m0 0h4m-4 0v-4m11 5l5-5m0 0h-4m4 0v-4M9 10L4 5m0 0h4M4 5v4m11-4l5 5m0-5h-4m4 0v4" />
          </svg>
          <span x-text="isFullscreen ? 'Exit Fullscreen' : 'Fullscreen'"></span>
        </button>

        <!-- Prominent Large Clock Display -->
        <span class="text-6xl sm:text-7xl font-mono font-bold bg-blue-50 text-blue-600 px-6 py-4 rounded-2xl border border-blue-100 tracking-tight"
      x-text="nowTime"></span>
      </div>
    </div>

    <!-- Admin Upload Area (Automatically hidden when in Fullscreen mode) -->
    <div x-show="!isFullscreen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 transform -translate-y-2"
         x-transition:enter-end="opacity-100 transform translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 transform translate-y-0"
         x-transition:leave-end="opacity-0 transform -translate-y-2"
         class="bg-white p-4 rounded-2xl border border-dashed border-gray-300 shadow-sm">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div>
          <h2 class="text-sm font-semibold text-gray-700">Upload Tee Times Sheet (.xlsx)</h2>
          <p class="text-xs text-gray-400 mt-0.5">Upload your Excel workbook containing the "Tee Times" tab.</p>
        </div>
        <label class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer transition shadow-sm hover:shadow">
          <span>Choose File</span>
          <input type="file" accept=".xlsx, .xls" class="hidden" @change="handleFileUpload">
        </label>
      </div>
    </div>

    <!-- Empty States -->
    <div x-show="!hasLoadedData" class="text-center py-16 bg-white rounded-2xl border border-gray-200 text-gray-400 text-sm shadow-sm space-y-2">
      <svg class="w-12 h-12 mx-auto text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <p class="font-medium">No schedule loaded yet.</p>
      <p class="text-xs text-gray-400">Upload your Excel spreadsheet above to display today's tee times.</p>
    </div>
    
    <div x-show="hasLoadedData && events.length === 0" class="text-center py-16 bg-white rounded-2xl border border-gray-200 text-gray-400 text-sm shadow-sm">
      <p class="font-medium">No remaining tee times scheduled for today</p>
    </div>

    <!-- Single-Column Tee Times Cards View -->
    <div x-show="hasLoadedData && events.length > 0" class="flex flex-col gap-4 w-full">
      <template x-for="event in events" :key="getEventField(event, 'Team Name') + getEventField(event, 'Start Time')">
        <div class="p-5 rounded-2xl border bg-white shadow-sm transition-all space-y-3 flex flex-col justify-between"
             :class="{ 'border-2 border-green-500 bg-green-50/50 ring-2 ring-green-200/50 shadow-md': isLive(event) }">
          
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <!-- 12-Hour AM/PM Formatted Time Display -->
              <span class="text-2xl font-bold text-gray-600 bg-gray-100 px-3 py-1 rounded-lg" 
                    x-text="formatDisplayTime(getEventField(event, 'Start Time')) + ' - ' + formatDisplayTime(getEventField(event, 'End Time'))"></span>
              
              <template x-if="isLive(event)">
                <span class="text-[20px] font-bold px-3 py-1 rounded-full bg-green-500 text-white animate-pulse tracking-wide">ON TEE</span>
              </template>
              <template x-if="!isLive(event)">
                <span class="text-[20px] font-bold px-3 py-1 rounded-full bg-gray-200 text-gray-600 tracking-wide">UPCOMING</span>
              </template>
            </div>

          </div>

          <!-- Team Name + Players Inline -->
            <div class="flex flex-wrap items-center gap-3 pt-1">

            <!-- Team Name -->
            <h3 class="font-extrabold text-gray-800 text-xl leading-tight"
                x-text="getEventField(event, 'Team Name') || 'Unnamed Team'"></h3>

            <!-- Players -->
            <div class="flex flex-wrap gap-2">
                <template x-for="member in getMembers(event)" :key="member">
                    <span class="bg-gray-100 text-gray-700 px-3 py-1 rounded-lg text-lg font-semibold"
                    x-text="member"></span>
                </template>
            </div>

        </div>
        </div>
      </template>
    </div>

  </div>

  <script>
    function scheduleApp() {
      return {
        scheduleBySheet: {},
        events: [],
        nowTime: '',
        currentDayName: '',
        currentMinutes: 0,
        hasLoadedData: false,
        isFullscreen: false,

        init() {
          const savedData = localStorage.getItem('tee_times_workbook');
          if (savedData) {
            this.scheduleBySheet = JSON.parse(savedData);
            this.hasLoadedData = true;
            this.updateEvents();
          }

          this.updateClock();
          setInterval(() => {
            this.updateClock();
            this.updateEvents();
          }, 1000);

          // Detect native full-screen change events across browsers
          const handleFullscreenChange = () => {
            this.isFullscreen = !!(
              document.fullscreenElement || 
              document.webkitFullscreenElement || 
              document.mozFullScreenElement || 
              document.msFullscreenElement
            );
          };

          document.addEventListener('fullscreenchange', handleFullscreenChange);
          document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
          document.addEventListener('mozfullscreenchange', handleFullscreenChange);
          document.addEventListener('msfullscreenchange', handleFullscreenChange);
        },

        toggleFullscreen() {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
              document.documentElement.webkitRequestFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          }
        },

        handleFileUpload(e) {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array', cellDates: false });

            const parsedSheets = {};
            workbook.SheetNames.forEach(sheetName => {
              const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { raw: false });
              parsedSheets[sheetName.trim()] = json;
            });

            this.scheduleBySheet = parsedSheets;
            this.hasLoadedData = true;
            localStorage.setItem('tee_times_workbook', JSON.stringify(parsedSheets));
            this.updateEvents();
          };
          reader.readAsArrayBuffer(file);
        },

        updateClock() {
          const now = new Date();
          this.nowTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          this.currentDayName = now.toLocaleDateString([], { weekday: 'long' });
          this.currentMinutes = now.getHours() * 60 + now.getMinutes();
        },

        getEventField(event, fieldName) {
          if (!event) return '';
          const key = Object.keys(event).find(k => k.trim().toLowerCase() === fieldName.toLowerCase());
          return key ? event[key] : '';
        },

        getMembers(event) {
          const members = [];
          ['Member 1', 'Member 2', 'Member 3', 'Member 4'].forEach(mKey => {
            const val = this.getEventField(event, mKey);
            if (val) members.push(val);
          });
          return members;
        },

        updateEvents() {
          const sheetKeys = Object.keys(this.scheduleBySheet);
          
          let key = sheetKeys.find(k => k.trim().toLowerCase() === 'tee times') ||
                    sheetKeys.find(k => k.trim().toLowerCase() === this.currentDayName.toLowerCase()) ||
                    sheetKeys[0];

          const rawList = key ? (this.scheduleBySheet[key] || []) : [];

          this.events = rawList.filter(event => {
            const endTimeVal = this.getEventField(event, 'End Time');
            const endMins = this.timeToMinutes(endTimeVal);
            return this.currentMinutes < endMins;
          }).sort((a, b) => {
            return this.timeToMinutes(this.getEventField(a, 'Start Time')) - this.timeToMinutes(this.getEventField(b, 'Start Time'));
          });
        },

        timeToMinutes(rawTime) {
          if (!rawTime) return 0;

          let str = rawTime.toString().trim().toUpperCase();
          const isPM = str.includes('PM');
          const isAM = str.includes('AM');

          str = str.replace('AM', '').replace('PM', '').trim();

          const parts = str.split(':').map(Number);
          let h = parts[0] || 0;
          let m = parts[1] || 0;

          if (isPM && h < 12) h += 12;
          if (isAM && h === 12) h = 0;

          return (h * 60) + m;
        },

        formatDisplayTime(rawTime) {
          if (!rawTime) return '';

          let totalMins = this.timeToMinutes(rawTime);
          let h = Math.floor(totalMins / 60);
          let m = totalMins % 60;

          let ampm = h >= 12 ? 'PM' : 'AM';
          h = h % 12;
          if (h === 0) h = 12;

          let formattedMinutes = m < 10 ? '0' + m : m;

          return `${h}:${formattedMinutes} ${ampm}`;
        },

        isLive(event) {
          const startMins = this.timeToMinutes(this.getEventField(event, 'Start Time'));
          const endMins = this.timeToMinutes(this.getEventField(event, 'End Time'));
          return this.currentMinutes >= startMins && this.currentMinutes < endMins;
        }
      }
    }
  </script>
</body>
</html>
